name: Codex runtime verification

on:
  push:
    branches: [main, codex]
  pull_request:
    branches: [main, codex]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        codex-version: ['0.149.0', 'latest']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install test runtime
        run: |
          brew install tmux
          export PATH="$HOME/.local/bin:$PATH"
          herdr_installer="$(/usr/bin/mktemp "${RUNNER_TEMP}/herdr-install.XXXXXX")"
          herdr_home="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/herdr-home.XXXXXX")"
          installer="$(/usr/bin/mktemp "${RUNNER_TEMP}/codex-install.XXXXXX")"
          trap '/bin/rm -f "$herdr_installer" "$installer"; /bin/rm -rf "$herdr_home"' EXIT
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$herdr_home" \
            /usr/bin/curl -q --fail --location --proto '=https' \
              --proto-redir '=https' --tlsv1.2 --noproxy '*' \
              --output "$herdr_installer" https://herdr.dev/install.sh
          /bin/chmod 0700 "$herdr_installer"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$herdr_home" \
            TMPDIR="$RUNNER_TEMP" HERDR_INSTALL_DIR="$HOME/.local/bin" \
            /bin/sh "$herdr_installer"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" \
            /usr/bin/curl -q --fail --location --proto '=https' \
              --proto-redir '=https' --tlsv1.2 --noproxy '*' \
              --output "$installer" https://chatgpt.com/codex/install.sh
          /usr/bin/env -i PATH="$PATH" HOME="$HOME" SHELL=/bin/bash \
            CODEX_NON_INTERACTIVE=1 \
            /bin/sh "$installer" --release '${{ matrix.codex-version }}'
          "$HOME/.local/bin/codex" --version
          "$HOME/.local/bin/herdr" --version
          bun --config=/dev/null --no-env-file zerokun/standalone-codex.ts version
          . ./zerokun/codex-version.sh
          zerokun_require_herdr_version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Codex-native Zero-kun
        run: bash zerokun/verify.sh
      - name: Verify Codex managed-config protocol
        run: |
          export CODEX_HOME="$(mktemp -d "${RUNNER_TEMP}/zerokun-codex-home.XXXXXX")"
          bun zerokun/codex-executor.ts verify-codex-config
