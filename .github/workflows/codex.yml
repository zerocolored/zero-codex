name: Codex runtime verification

on:
  push:
    branches: [main, codex]
  pull_request:
    branches: [main, codex]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        codex-version: ['0.149.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install test runtime
        run: |
          brew install tmux
          npm install --global @openai/codex@${{ matrix.codex-version }}
      - name: Verify Codex-native Zero-kun
        run: bash zerokun/verify.sh
      - name: Verify Codex managed-config protocol
        run: |
          export CODEX_HOME="$(mktemp -d "${RUNNER_TEMP}/zerokun-codex-home.XXXXXX")"
          bun zerokun/codex-executor.ts verify-system-config
