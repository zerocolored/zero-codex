_metadata:
  major_version: 1
display_information:
  # bootstrap実行時に入力した表示名へ置換される。直接使う場合もこの名前は変更可能。
  name: Zeroちゃん
  description: ローカルで動くSlackアシスタントとやり取りするためのアプリ
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    # Slackの制約: a-z、0-9、-、_、. のみ。日本語は使用不可。
    display_name: zerochan
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - member_joined_channel
      - message.im
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
