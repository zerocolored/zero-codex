<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Zeroちゃんシリーズの受付状況と現在の作業を確認できます"><title>みんなの稼働状況</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true">Z</span><strong>Zeroちゃん</strong><span class="tag">稼働状況</span></div><button id="logout" hidden>ログアウト</button></header>
<main><section id="login" hidden><h1>稼働状況を確認する</h1><form id="login-form"><label for="password">共通パスワード</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">ログイン</button><p id="login-error" role="alert"></p></form></section>
<section id="dashboard" hidden><div class="heading"><h1>みんなの稼働状況</h1><span id="updated" class="muted"></span></div><p id="error" role="status" hidden></p><div id="counts" class="counts"></div><section class="list"><div class="list-heading"><h2>Zeroちゃん一覧 <span id="total"></span></h2><span class="muted">状態と時刻は各PCからの報告をもとに表示</span></div><div class="columns" aria-hidden="true"><span>名前 / プロジェクト</span><span>今の受付状況</span><span>現在の作業</span><span>最後の依頼受付</span><span>最終通信</span></div><div id="rows"></div></section><p class="foot">通信が途絶えた場合は「空き」ではなく「状態不明」と表示します。</p></section>
<p id="loading" role="status">稼働状況を読み込んでいます…</p></main></body></html>
