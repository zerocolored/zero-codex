<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヒアリングルーム</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
<section class="stage" aria-label="会議画面">
<canvas id="scene" width="1280" height="720" role="img" aria-label="会議の映像と共有画面"></canvas>
<div id="entry" class="overlay"><div class="entry-card"><h1>ゼロちゃんと話す</h1><p>会議画面・共有画面・双方の音声を録画し、プロジェクトの端末に保存します。音声・会話の文脈・共有画像はOpenAIへ、AIの音声はSimliへ送信します。</p><button id="join" class="primary" disabled>同意して入室</button></div></div>
<p id="status" role="status" aria-live="polite">準備ができたら入室してください</p>
</section>
<nav class="controls" aria-label="会議の操作">
<button id="speaker" disabled aria-pressed="false"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 8q5 4 0 8M19 5q8 7 0 14" class="line"/></svg></span><span>ミュート</span></button>
<button id="mute" disabled aria-pressed="false"><span class="icon"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" class="line"/></svg></span><span>マイクオフ</span></button>
<button id="share" disabled aria-pressed="false"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" class="line"/><path d="M8 20h8M12 16v4M12 13V7m0 0l-3 3m3-3l3 3" class="line"/></svg></span><span id="shareLabel">画面共有</span></button>
<button id="end" disabled class="danger"><span class="icon"><svg viewBox="0 0 24 24"><path d="M3 13q9-9 18 0l-3 3-4-2v-3h-4v3l-4 2z"/></svg></span><span>終了</span></button>
</nav>
<div class="recovery"><button id="retry" hidden>録画の保存を再試行</button><button id="download" hidden>録画をダウンロード</button></div>
<p id="saveState" role="status"></p>
</main><audio id="remoteAudio" autoplay></audio><audio id="avatarAudio" autoplay></audio><video id="avatar" autoplay muted playsinline hidden></video><video id="screen" autoplay muted playsinline hidden></video><script type="module" src="/app.js"></script></body></html>
