<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヒアリングルーム</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <header><div class="brand"><span class="mark" aria-hidden="true">◌</span><div><span class="eyebrow">HEARING ROOM</span><h1 id="project">ヒアリング</h1></div></div><span id="recordState" class="badge">入室前</span></header>
  <section class="stage" aria-label="会議画面"><canvas id="scene" width="1280" height="720" role="img" aria-label="柔らかな人型。相手の声に合わせて光が広がります"></canvas><div class="stageLabel"><span class="presence"></span><span>アシスタント</span><span class="ai">AI音声</span></div><button id="motion" class="subtle">動きを止める</button></section>
  <p id="status" role="status" aria-live="polite">準備ができたら入室してください</p>
  <div id="entry"><p class="consent">会議画面・共有画面・あなたとAIの音声を録画し、プロジェクトの端末に保存します。音声と会話の文脈はOpenAIへ送信します。</p><button id="join" class="primary" disabled>録画に同意して入室</button></div>
  <nav class="controls" aria-label="会議の操作"><button id="mute" disabled aria-pressed="false"><span aria-hidden="true">♩</span>ミュート</button><button id="share" disabled><span aria-hidden="true">▣</span>画面共有</button><button id="end" disabled class="danger">会議を終了</button></nav>
  <div class="recovery"><button id="retry" hidden>録画の保存を再試行</button><button id="download" hidden>録画をダウンロード</button></div>
  <p class="footnote" id="saveState">招待リンクは参加する人だけに共有してください</p>
</main><audio id="remoteAudio" autoplay></audio><video id="screen" autoplay muted playsinline hidden></video><script type="module" src="/app.js"></script></body></html>
